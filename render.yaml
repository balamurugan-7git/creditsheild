services:
  # ─── 1. FastAPI Backend API ───────────────────────────────────────────────
  - type: web
    name: credishield-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT
        value: "60/minute"
      - key: MODEL_PATH
        value: "../ml/artifacts/model_v1.joblib"
      - key: MODEL_META_PATH
        value: "../ml/artifacts/model_v1_meta.json"
      - key: POLICY_PATH
        value: "./policy/thresholds.json"
      - key: DATABASE_URL
        value: "sqlite:///./credishield.db"

  # ─── 2. React + Vite Frontend ─────────────────────────────────────────────
  - type: web
    name: credishield-web
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: credishield-api
          property: host
