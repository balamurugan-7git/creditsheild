version: '3.9'

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: credishield_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credishield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credishield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-credishield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credishield}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credishield_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-credishield}:${POSTGRES_PASSWORD:-credishield_secret}@db:5432/${POSTGRES_DB:-credishield}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80}
      RATE_LIMIT: 10/minute
      MODEL_PATH: /app/ml_artifacts/model_v1.joblib
      MODEL_META_PATH: /app/ml_artifacts/model_v1_meta.json
      POLICY_PATH: /app/policy/thresholds.json
    volumes:
      - ../ml/artifacts:/app/ml_artifacts:ro
      - ./backend/policy:/app/policy:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credishield_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:8000

volumes:
  postgres_data:
